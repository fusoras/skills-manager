name: Release skm Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-musl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install aarch64 cross-linker & musl tools
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          set -Eeuo pipefail
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: |
          set -Eeuo pipefail
          cargo build --release --target ${{ matrix.target }}

      - name: Package binary into tarball
        run: |
          set -Eeuo pipefail
          tar -czf skm-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release skm

      - name: Upload asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: skm-${{ matrix.target }}.tar.gz
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
